services:
  - type: web
    name: curry-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: streamlit run app/main.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
